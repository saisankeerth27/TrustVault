services:
  - type: web
    name: trustvault-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Apply migrations with `alembic upgrade head` from a trusted shell before or
    # after deploys. Migrations are not run automatically at startup.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      # Vercel and Render are cross-site by default, so the recovery cookie must be
      # Secure and SameSite=None. The backend still enforces an Origin allow-list.
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: AUTH_RATE_LIMIT_ATTEMPTS
        value: "10"
      - key: AUTH_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      # Private Supabase Storage configuration. Set these in the Render dashboard.
      # Keep the bucket private and never place these values in the frontend.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: PASSWORD_RECOVERY_REDIRECT_URL
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "10485760"
      - key: ALLOWED_UPLOAD_EXTENSIONS
        value: pdf,txt,docx,png,jpg,jpeg
      # Optional audit checkpoints. Set both or neither in the Render dashboard.
      # AUDIT_CHECKPOINT_PATH must be absolute and on persistent, access-controlled
      # storage. Render's default filesystem is ephemeral; use a persistent volume
      # or external store if checkpoints must survive instance replacement.
      - key: AUDIT_CHECKPOINT_SIGNING_KEY
        sync: false
      - key: AUDIT_CHECKPOINT_PATH
        sync: false
